input {
    udp {
        port => 8555
        codec => json
    }
}
filter {
    if [message] =~ "\A\{.+\}\z" {
        json {
            source => "message"
            target => "parsed_msg"
            remove_field => ["message"]
        }
    }

    # Drop failed_auth logs entirely
    if [parsed_msg][type] == "failed_auth" {
        drop { }
    }
}
output {
    # Debug output to stdout
    #stdout {
    #    codec => rubydebug
    #}

    # Route error logs to error index
    if [level] == "ERROR" or [parsed_msg][level_name] == "ERROR" {
        elasticsearch {
            hosts => "elasticsearch:9200"
            user => "logstash_internal"
            password => "${LOGSTASH_INTERNAL_PASSWORD}"
            index => "laravel-error-%{+YYYY-MM}"
        }
    } else {
        # All other logs go to general laravel index
        elasticsearch {
            hosts => "elasticsearch:9200"
            user => "logstash_internal"
            password => "${LOGSTASH_INTERNAL_PASSWORD}"
            index => "laravel-info-%{+YYYY-MM}"
        }
    }
}
